# Patent claim-support map (roadmap P5-08).
#
# Human-authored, attorney-reviewed before any filing — this is evidence
# tooling, not legal advice. backend/scripts/build_dossier.py resolves
# EVERY pointer below against the actual repository state (the symbol
# exists, the referenced test is collectible and passes) and the build
# FAILS if one doesn't resolve, rather than trusting this file to stay
# accurate by hand. Anything that doesn't resolve is listed in the output
# under "NOT YET REDUCED TO PRACTICE", never silently dropped.
#
# `code` entries use the form "path::symbol" for Python (resolved via
# import + getattr/inspect) or "path::symbol" for TypeScript/TSX (resolved
# via a textual search for an exported declaration — this repo has no
# TypeScript compiler available to the dossier build, so this is a weaker
# check than the Python one and is labelled as such in the output).
#
# `test` entries use the form "path::test_name" (pytest node id, function
# name only — parametrized tests resolve via name prefix match, covering
# every parametrization).

version: 1

claims:
  - id: C1
    text: >
      A method of scoring a learner's performance by computing a plurality
      of behavioral/interaction-derived parameters, applying a weighting
      profile selected according to a declared or inferred disability
      classification, excluding from the weighted composite any parameter
      for which a more severe form of the classified condition would
      mechanically depress the parameter independent of learning outcome,
      renormalizing the remaining weights over the parameters actually
      measurable for the given session, and reporting a coverage value
      indicating what fraction of the profile's intended weight was
      measured.
    elements:
      - id: C1.a
        text: Per-disability weight profiles, loaded from versioned config.
        code: backend/services/dase_engine.py::profile_weights
        test: backend/tests/test_dase_formulas.py::test_composite_invariants
      - id: C1.b
        text: Diagnostic-only exclusion — computed and reported, never scored.
        code: backend/services/dase_engine.py::diagnostic_only
        test: backend/tests/test_dase_formulas.py::test_override_weights_replace_profile_defaults_but_keep_diagnostic_rule
      - id: C1.c
        text: Weighted composite with renormalization over present parameters and a reported coverage fraction.
        code: backend/services/dase_engine.py::compute_dase
        test: backend/tests/test_dase_formulas.py::test_composite_is_monotonic_in_accuracy_when_all_else_equal
        evidence:
          config: backend/data/dase_profiles.json
          sha256: auto
      - id: C1.d
        text: A teacher may override a specific student's weight profile, with a mandatory logged reason, without altering the diagnostic-only exclusion rule.
        code: backend/routers/overrides.py::set_weight_override
        test: backend/tests/test_overrides_and_scoring.py::test_mapped_teacher_can_set_an_override_and_it_changes_the_next_score

  - id: C2
    text: >
      A method of classifying the probable cause of an incorrect learner
      response by comparing the response's latency against that specific
      learner's own historical response-time baseline (never a cohort or
      population baseline) in combination with a face-presence signal,
      producing a labelled classification with an associated confidence
      value and, where two causes are indistinguishable on the available
      signals, abstaining to a default label while recording the
      alternative causes rather than selecting one by default.
    elements:
      - id: C2.a
        text: Personal (never cohort) response-time baseline.
        code: backend/services/dase_engine.py::rolling_median
        test: backend/tests/test_classifier.py::test_thin_baseline_caps_confidence_even_on_a_clear_processing_delay
      - id: C2.b
        text: Four-way cause classification with confidence and recorded alternatives.
        code: backend/services/dase_engine.py::classify_error
        test: backend/tests/test_classifier.py::test_classifier_abstains_without_focus_data
      - id: C2.c
        text: Abstention when the face-presence signal is absent or has too few samples to trust.
        code: backend/services/dase_engine.py::classify_error
        test: backend/tests/test_classifier.py::test_classifier_abstains_with_too_few_focus_samples
      - id: C2.d
        text: Server-side re-classification at ingest from stored raw signals, independent of client-supplied labels, versioned so a formula change relabels old events without a backfill migration.
        code: backend/routers/telemetry.py::_reclassify_if_stale
        test: backend/tests/test_telemetry_reclassification.py::test_stale_classifier_version_is_recomputed

  - id: C3
    text: >
      A method of serving a pre-generated, profile-constrained simpler
      variant of a learning item immediately upon classifying an incorrect
      response as a comprehension barrier at or above a confidence
      threshold, tracking the re-presented attempt as a distinct event
      correlated to the original item rather than overwriting the original
      record.
    elements:
      - id: C3.a
        text: Confidence-gated decision to re-present.
        code: backend/services/dase_engine.py::should_represent
        test: backend/tests/test_classifier.py::test_should_represent_true_only_for_confident_comprehension_barrier
      - id: C3.b
        text: Frontend closed loop — classify, swap the item in place, track the re-presentation as a distinct attempt.
        code: frontend/src/pages/QuizPage.tsx::handleSubmit
        test: backend/tests/test_contract.py::test_frontend_shaped_event_reaches_the_engine_and_is_classified

  - id: C4
    text: >
      A method of computing a non-clinical, interaction-only resilience
      signal from a combination of: response latency relative to the
      learner's own baseline, frequency of response revision, frequency of
      input-focus loss, and a mean sentiment score derived from a
      conversational support interface, where the signal's constituent
      weights are renormalized over whichever inputs are available for a
      given session rather than requiring all four.
    elements:
      - id: C4.a
        text: Weight-renormalizing hesitation index over 1-4 available interaction signals.
        code: backend/services/hesitation.py::hesitation_index
        test: backend/tests/test_phase4_services.py::test_hesitation_index_renormalizes_over_available_signals
      - id: C4.b
        text: Per-session aggregation of the four input signals into the index.
        code: backend/services/dase_engine.py::_resil
        test: backend/tests/test_dase_formulas.py::test_resil_present_from_answer_changes_and_latency_alone

  - id: C5
    text: >
      A method of presenting a machine-generated, multi-step numeric
      solution to a learner in which each proposed step is independently
      re-evaluated by a deterministic, restricted expression evaluator
      before being displayed, such that a step whose claimed result does
      not match independent re-evaluation is discarded rather than shown,
      combined with a deterministic (non-generative) typing of the
      conceptual or procedural cause of an incorrect numeric response.
    elements:
      - id: C5.a
        text: Restricted-grammar expression evaluator (no eval/sympify on model output).
        code: backend/services/math_steps.py::safe_eval
        test: backend/tests/test_phase4_services.py::test_safe_eval_rejects_function_calls
      - id: C5.b
        text: Per-step independent re-verification; an unverifiable step is dropped, never shown.
        code: backend/services/math_steps.py::verify_steps
        test: backend/tests/test_phase4_services.py::test_verify_steps_drops_a_step_whose_result_does_not_check_out
      - id: C5.c
        text: Deterministic error typing from the structural relationship between the correct and given answers.
        code: backend/services/math_steps.py::classify_math_error
        test: backend/tests/test_phase4_services.py::test_classify_math_error_truth_table

  - id: C6
    text: >
      A method of scoring a learner's free-form written response along two
      independent axes — concept coverage and written-expression quality —
      in which concept coverage is computed deterministically from a
      machine-identified evidentiary span that is independently verified to
      appear verbatim in the learner's own response (a claimed match that
      fails this verification is rejected regardless of the machine's own
      assertion), and the written-expression axis is excluded from any
      composite score for a condition whose more severe form would
      mechanically depress it.
    elements:
      - id: C6.a
        text: Deterministic, verbatim-verified concept-coverage scoring.
        code: backend/services/writing_score.py::score_know
        test: backend/tests/test_phase4_services.py::test_score_know_rejects_a_claimed_quote_that_is_not_actually_in_the_answer
      - id: C6.b
        text: Independent written-expression rubric score, excluded from the composite for the relevant profile.
        code: backend/services/writing_score.py::score_expr
        test: backend/tests/test_phase4_services.py::test_score_expr_computes_weighted_rubric

build:
  outputs:
    md: docs/claims/patent_dossier.md
    json: docs/claims/patent_dossier.json
  config_hash_source: backend/data/dase_profiles.json
